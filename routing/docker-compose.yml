# Self-hosted OSRM routing engine for the dispatch simulation.
# Run ./setup.ps1 once (downloads the road network and prepares it); after that `docker compose up -d` is enough.
services:
  osrm:
    image: osrm/osrm-backend:latest
    container_name: dispatch-osrm
    command: osrm-routed --algorithm mld --max-matching-size 100 /data/area.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data:ro
    restart: unless-stopped
