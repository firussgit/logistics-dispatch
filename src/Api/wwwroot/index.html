<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dispatch Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Dispatch Dashboard</h1>
    <span id="conn" class="conn offline">Connecting…</span>
  </header>

  <main>
    <section class="tiles" id="tiles"></section>

    <section class="card">
      <h2>Live map <small style="color:var(--muted)">(click a job row to focus it)</small></h2>
      <div id="map"></div>
    </section>

    <section class="card">
      <h2>New job</h2>
      <form id="job-form">
        <input name="customerName" placeholder="Customer" required maxlength="100">
        <input name="pLat" type="number" step="any" placeholder="Pickup lat" required>
        <input name="pLng" type="number" step="any" placeholder="Pickup lng" required>
        <input name="dLat" type="number" step="any" placeholder="Dropoff lat" required>
        <input name="dLng" type="number" step="any" placeholder="Dropoff lng" required>
        <button type="button" id="random-btn">Random nearby</button>
        <button type="submit" class="primary">Create job</button>
      </form>
    </section>

    <div class="grid">
      <section class="card">
        <h2>Jobs</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Ref</th><th>Customer</th><th>Status</th><th>Driver</th><th>Progress</th><th>ETA</th><th></th></tr></thead>
            <tbody id="jobs"></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <h2>Drivers</h2>
        <ul id="drivers" class="drivers"></ul>
      </section>
    </div>
  </main>

  <div id="toasts"></div>
  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
