<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My deliveries</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    main.customer { max-width: 820px; }
    #map { height: 380px; cursor: crosshair; }
    .steps { display: grid; gap: 4px; margin: 0 0 10px; color: var(--muted); font-size: 13px; }
    .picked { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
    .picked div { border: 1px dashed var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
    .picked b { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
    .picked .set { border-style: solid; }
    .order-form { display: grid; gap: 10px; }
    .order-form input[type=text] { width: 100%; padding: 8px 10px; }
    .order-form .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .orders { display: grid; gap: 10px; }
    .order { border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: grid; gap: 8px; }
    .order.active { border-color: var(--accent); }
    .order .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .order .eta { color: var(--muted); font-size: 13px; }
    .order .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .order a.button { text-decoration: none; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; }
    .empty { color: var(--muted); text-align: center; padding: 18px 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>My deliveries</h1>
    <span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
      <span id="userbox" class="userbox"></span>
      <span id="conn" class="conn offline">Connecting…</span>
    </span>
  </header>

  <main class="customer">
    <section class="card">
      <h2>Order a delivery</h2>
      <div class="steps"><span>1. Click the map to set the <b>pickup</b></span><span>2. Click again for the <b>dropoff</b> (a third click starts over)</span></div>
      <div id="map"></div>
      <div class="picked">
        <div id="pickup-box"><b>Pickup</b><span>not set</span></div>
        <div id="dropoff-box"><b>Dropoff</b><span>not set</span></div>
      </div>
      <form id="order-form" class="order-form">
        <input type="text" id="notes" placeholder="Note for the driver (optional)" maxlength="500">
        <div class="row">
          <button type="button" id="random-btn">Pick random spots</button>
          <button type="button" id="reset-btn">Clear</button>
          <button type="submit" id="place-btn" class="primary" disabled>Place order</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>My orders</h2>
      <div id="orders" class="orders"><div class="empty">No orders yet.</div></div>
    </section>
  </main>

  <div id="toasts"></div>
  <script src="auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="map.js"></script>
  <script src="customer.js"></script>
</body>
</html>
